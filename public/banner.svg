<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Statesmen AI: chat with British politicians, answered from their real speeches in Parliament">
  <!-- GOV.UK-style colours: brand blue band, white body, near-black text. -->
  <rect width="1280" height="320" fill="#ffffff"/>
  <rect width="1280" height="190" fill="#1d70b8"/>

  <!-- Portico mark (same shapes as app/icon.svg), white on blue. -->
  <g transform="translate(96 47) scale(3)" fill="#ffffff">
    <polygon points="16,5 27,11 5,11"/>
    <rect x="7" y="13" width="4" height="9"/>
    <rect x="14" y="13" width="4" height="9"/>
    <rect x="21" y="13" width="4" height="9"/>
    <rect x="5" y="23" width="22" height="4"/>
  </g>

  <text x="220" y="125" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700" fill="#ffffff">Statesmen AI</text>

  <text x="96" y="248" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#0b0c0c">Chat with British politicians, answered from their real speeches in Parliament.</text>
  <rect x="96" y="270" width="64" height="24" fill="#d2e2f1"/>
  <text x="128" y="288" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#0f385c">Beta</text>
  <text x="176" y="288" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#484949">Independent project. Not a government service. Replies are AI-generated.</text>
</svg>
