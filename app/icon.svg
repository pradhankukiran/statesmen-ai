<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Brand blue tile (#1d70b8), square like the rest of the design. -->
  <rect width="32" height="32" fill="#1d70b8"/>
  <!-- White portico: pediment, three columns, base. Solid shapes on whole
       pixels so it stays crisp at 16px. -->
  <g fill="#ffffff">
    <polygon points="16,5 27,11 5,11"/>
    <rect x="7" y="13" width="4" height="9"/>
    <rect x="14" y="13" width="4" height="9"/>
    <rect x="21" y="13" width="4" height="9"/>
    <rect x="5" y="23" width="22" height="4"/>
  </g>
</svg>
